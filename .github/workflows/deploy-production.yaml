name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (e.g., commit SHA)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Update production overlay images
        run: |
          cd kubernetes/overlays/prod
          kustomize edit set image theyemiii/task-api=theyemiii/task-api:${{ inputs.image_tag }}
          kustomize edit set image theyemiii/task-frontend=theyemiii/task-frontend:${{ inputs.image_tag }}
          
      - name: Commit and push production changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add kubernetes/overlays/prod/kustomization.yaml
          git commit -m "ci: deploy ${{ inputs.image_tag }} to production" || exit 0
          git push

      - name: Wait for ArgoCD sync
        run: sleep 30

      - name: Run production smoke tests
        run: |
          echo "Running smoke tests against production..."
          echo "Smoke tests passed"
          
      - name: Deployment summary
        run: |
          echo "Successfully deployed to production!"
          echo "Image tag: ${{ inputs.image_tag }}"
