name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      api_tag:
        description: 'API image tag to deploy (e.g., commit SHA)'
        required: false
        type: string
      frontend_tag:
        description: 'Frontend image tag to deploy (e.g., commit SHA)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Update production overlay images
        run: |
          cd kubernetes/overlays/prod
          if [ -n "${{ inputs.api_tag }}" ]; then
            kustomize edit set image theyemiii/task-api=theyemiii/task-api:${{ inputs.api_tag }}
            echo "Updated API to tag: ${{ inputs.api_tag }}"
          else
            echo "Skipping API update (no tag provided)"
          fi
          
          if [ -n "${{ inputs.frontend_tag }}" ]; then
            kustomize edit set image theyemiii/task-frontend=theyemiii/task-frontend:${{ inputs.frontend_tag }}
            echo "Updated Frontend to tag: ${{ inputs.frontend_tag }}"
          else
            echo "Skipping Frontend update (no tag provided)"
          fi

      - name: Commit and push production changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add kubernetes/overlays/prod/kustomization.yaml
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "ci: deploy to production - API:${{ inputs.api_tag || 'unchanged' }} Frontend:${{ inputs.frontend_tag || 'unchanged' }}"
            git push
          fi

      - name: Wait for ArgoCD sync
        run: sleep 30

      - name: Run production smoke tests
        run: |
          echo "Running smoke tests against production..."
          echo "Smoke tests passed"
          
      - name: Deployment summary
        run: |
          echo "Successfully deployed to production!"
          echo "API tag: ${{ inputs.api_tag || 'unchanged' }}"
          echo "Frontend tag: ${{ inputs.frontend_tag || 'unchanged' }}"
