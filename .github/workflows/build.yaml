name: Build and Deploy

on:
  push:
    branches: [main]
    paths:
      - 'application/**'

permissions:
  contents: read

jobs:
  sast-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Run Semgrep SAST
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/python
            
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'application/api/**'
            frontend:
              - 'application/frontend/**'

  build-api:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.api == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build API image
        run: |
          docker build -t theyemiii/task-api:${{ github.sha }} \
                       -t theyemiii/task-api:latest \
                       application/api/

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: theyemiii/task-api:${{ github.sha }}
          format: table
          severity: CRITICAL
          exit-code: 1

      - name: Push API image
        run: |
          docker push theyemiii/task-api:${{ github.sha }}
          docker push theyemiii/task-api:latest

  build-frontend:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build frontend image
        run: |
          docker build -t theyemiii/task-frontend:${{ github.sha }} \
                       -t theyemiii/task-frontend:latest \
                       application/frontend/

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: theyemiii/task-frontend:${{ github.sha }}
          format: table
          severity: CRITICAL
          exit-code: 1

      - name: Push frontend image
        run: |
          docker push theyemiii/task-frontend:${{ github.sha }}
          docker push theyemiii/task-frontend:latest

  update-manifests:
    runs-on: ubuntu-latest
    needs: [build-api, build-frontend]
    if: always() && (needs.build-api.result == 'success' || needs.build-frontend.result == 'success')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Update dev overlay images
        run: |
          cd kubernetes/overlays/dev
          if [ "${{ needs.build-api.result }}" == "success" ]; then
            kustomize edit set image theyemiii/task-api=theyemiii/task-api:${{ github.sha }}
          fi
          if [ "${{ needs.build-frontend.result }}" == "success" ]; then
            kustomize edit set image theyemiii/task-frontend=theyemiii/task-frontend:${{ github.sha }}
          fi
          
      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add kubernetes/overlays/dev/kustomization.yaml
          git commit -m "ci: update dev images to ${{ github.sha }}" || exit 0
          git push