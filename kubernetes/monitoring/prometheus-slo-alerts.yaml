apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-slo-alerts
  namespace: monitoring
data:
  slo-alerts.yaml: |
    groups:
    
    ###############################
    # USER-FACING ENDPOINTS ALERTS
    ###############################
    
    - name: slo_user_alerts
      interval: 30s
      rules:
      
      # CRITICAL: 14.4x burn rate
      - alert: UserEndpointErrorBudgetBurnCritical
        expr: |
          (
            job:slo_user_burn_rate:ratio_rate1h > 14.4
            and
            job:slo_user_burn_rate:ratio_rate5m > 14.4
          )
        labels:
          severity: critical
          slo: user_latency
        annotations:
          summary: "CRITICAL: User-facing API endpoints burning error budget at 14.4x"
          description: |
            User-facing endpoints (/tasks) are severely degraded.
            
            Current metrics:
            - 1h burn rate: {{ $value | humanizePercentage }}
            - 5m burn rate: {{ printf "job:slo_user_burn_rate:ratio_rate5m" | query | first | value | humanizePercentage }}
            - Error budget remaining: {{ printf "job:slo_user_error_budget:ratio" | query | first | value | humanizePercentage }}
            
            Budget exhausts in ~2 days at this rate.
            
            ACTION: Page on-call immediately. Check for:
            - Recent deployments
            - Database/Redis slowness
            - Resource exhaustion
      
      # HIGH: 6x burn rate
      - alert: UserEndpointErrorBudgetBurnHigh
        expr: |
          (
            job:slo_user_burn_rate:ratio_rate6h > 6
            and
            job:slo_user_burn_rate:ratio_rate1h > 6
          )
        labels:
          severity: high
          slo: user_latency
        annotations:
          summary: "HIGH: User-facing API latency degrading"
          description: |
            User endpoints burning error budget at 6x rate.
            
            Current metrics:
            - 6h burn rate: {{ $value | humanizePercentage }}
            - 1h burn rate: {{ printf "job:slo_user_burn_rate:ratio_rate1h" | query | first | value | humanizePercentage }}
            - Error budget remaining: {{ printf "job:slo_user_error_budget:ratio" | query | first | value | humanizePercentage }}
            
            Budget exhausts in ~5 days.
            
            ACTION: Investigate during business hours.
      
      # MEDIUM: 3x burn rate 
      - alert: UserEndpointErrorBudgetBurnMedium
        expr: |
          (
            job:slo_user_burn_rate:ratio_rate1d > 3
            and
            job:slo_user_burn_rate:ratio_rate6h > 3
          )
        labels:
          severity: warning
          slo: user_latency
        annotations:
          summary: "MEDIUM: User endpoint latency trending higher"
          description: |
            User endpoints burning error budget at 3x rate.
            
            Current metrics:
            - 1d burn rate: {{ $value | humanizePercentage }}
            - 6h burn rate: {{ printf "job:slo_user_burn_rate:ratio_rate6h" | query | first | value | humanizePercentage }}
            - Error budget remaining: {{ printf "job:slo_user_error_budget:ratio" | query | first | value | humanizePercentage }}
            
            Budget exhausts in ~10 days.
            
            ACTION: Create ticket for investigation.
      
      # LOW: 1x burn rate
      - alert: UserEndpointErrorBudgetBurnLow
        expr: |
          (
            job:slo_user_burn_rate:ratio_rate3d > 1
            and
            job:slo_user_burn_rate:ratio_rate1d > 1
          )
        for: 1h
        labels:
          severity: info
          slo: user_latency
        annotations:
          summary: "INFO: User endpoints at SLO threshold"
          description: |
            User endpoints burning budget at expected rate.
            
            Current metrics:
            - 3d burn rate: {{ $value | humanizePercentage }}
            - 1d burn rate: {{ printf "job:slo_user_burn_rate:ratio_rate1d" | query | first | value | humanizePercentage }}
            - Error budget remaining: {{ printf "job:slo_user_error_budget:ratio" | query | first | value | humanizePercentage }}
            
            Monitor for trends.
      
      # BUDGET EXHAUSTED
      - alert: UserEndpointErrorBudgetExhausted
        expr: |
          job:slo_user_error_budget:ratio < 0
        for: 5m
        labels:
          severity: critical
          slo: user_latency
        annotations:
          summary: "CRITICAL: User endpoint error budget exhausted"
          description: |
            User-facing endpoints have consumed entire 30-day error budget.
            
            Error budget remaining: {{ $value | humanizePercentage }}
            
            STOP ALL FEATURE DEPLOYMENTS.
            Focus on reliability improvements only.
    
    
    ###########################
    # HEALTH ENDPOINT ALERTS
    ###########################
    
    - name: slo_health_alerts
      interval: 30s
      rules:
      
      # HIGH: 14.4x burn rate
      - alert: HealthEndpointErrorBudgetBurnHigh
        expr: |
          (
            job:slo_health_burn_rate:ratio_rate1h > 14.4
            and
            job:slo_health_burn_rate:ratio_rate5m > 14.4
          )
        labels:
          severity: critical
          slo: health_latency
        annotations:
          summary: "HIGH: Health checks severely degraded"
          description: |
            /health endpoint latency exceeding 50ms threshold.
            
            Current metrics:
            - 1h burn rate: {{ $value | humanizePercentage }}
            - 5m burn rate: {{ printf "job:slo_health_burn_rate:ratio_rate5m" | query | first | value | humanizePercentage }}
            - Error budget remaining: {{ printf "job:slo_health_error_budget:ratio" | query | first | value | humanizePercentage }}
            
            This indicates systemic issues (DB connection pool, CPU throttling, etc).
            
            ACTION: Page immediately. Likely affects ALL endpoints.
      
      # HIGH: 6x burn rate
      - alert: HealthEndpointErrorBudgetBurnHigh
        expr: |
          (
            job:slo_health_burn_rate:ratio_rate6h > 6
            and
            job:slo_health_burn_rate:ratio_rate1h > 6
          )
        labels:
          severity: high
          slo: health_latency
        annotations:
          summary: "HIGH: Health check latency increasing"
          description: |
            Health endpoint response time degrading.
            
            Current metrics:
            - 6h burn rate: {{ $value | humanizePercentage }}
            - 1h burn rate: {{ printf "job:slo_health_burn_rate:ratio_rate1h" | query | first | value | humanizePercentage }}
            - Error budget remaining: {{ printf "job:slo_health_error_budget:ratio" | query | first | value | humanizePercentage }}
            
            Investigate infrastructure health.
      
      # MEDIUM: 3x burn rate
      - alert: HealthEndpointErrorBudgetBurnMedium
        expr: |
          (
            job:slo_health_burn_rate:ratio_rate1d > 3
            and
            job:slo_health_burn_rate:ratio_rate6h > 3
          )
        labels:
          severity: warning
          slo: health_latency
        annotations:
          summary: "MEDIUM: Health check latency trend concerning"
          description: |
            Health endpoint consistently slower than baseline.
            
            Current metrics:
            - 1d burn rate: {{ $value | humanizePercentage }}
            - 6h burn rate: {{ printf "job:slo_health_burn_rate:ratio_rate6h" | query | first | value | humanizePercentage }}
            - Error budget remaining: {{ printf "job:slo_health_error_budget:ratio" | query | first | value | humanizePercentage }}
            
            Review resource allocation.
      
      # BUDGET EXHAUSTED
      - alert: HealthEndpointErrorBudgetExhausted
        expr: |
          job:slo_health_error_budget:ratio < 0
        for: 5m
        labels:
          severity: critical
          slo: health_latency
        annotations:
          summary: "CRITICAL: Health endpoint error budget exhausted"
          description: |
            Health checks consistently exceeding 50ms threshold.
            
            Error budget remaining: {{ $value | humanizePercentage }}
            
            System is unhealthy. Immediate investigation required.