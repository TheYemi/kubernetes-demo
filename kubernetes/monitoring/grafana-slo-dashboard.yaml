apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-slo-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  slo-dashboard.json: |
    {
      "dashboard": {
        "title": "API SLO Dashboard - Multi-Endpoint",
        "tags": ["slo", "sre", "error-budget"],
        "timezone": "browser",
        "panels": [
          
          {
            "id": 1,
            "title": "User Endpoints - Error Budget Remaining",
            "type": "gauge",
            "targets": [
              {
                "expr": "job:slo_user_error_budget:ratio * 100",
                "legendFormat": "Budget %"
              }
            ],
            "gridPos": {"h": 8, "w": 6, "x": 0, "y": 0},
            "options": {
              "showThresholdLabels": false,
              "showThresholdMarkers": true
            },
            "fieldConfig": {
              "defaults": {
                "unit": "percent",
                "min": -100,
                "max": 100,
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    {"value": -100, "color": "red"},
                    {"value": 0, "color": "yellow"},
                    {"value": 50, "color": "green"}
                  ]
                }
              }
            }
          },
          
          {
            "id": 2,
            "title": "Health Endpoint - Error Budget Remaining",
            "type": "gauge",
            "targets": [
              {
                "expr": "job:slo_health_error_budget:ratio * 100",
                "legendFormat": "Budget %"
              }
            ],
            "gridPos": {"h": 8, "w": 6, "x": 6, "y": 0},
            "options": {
              "showThresholdLabels": false,
              "showThresholdMarkers": true
            },
            "fieldConfig": {
              "defaults": {
                "unit": "percent",
                "min": -100,
                "max": 100,
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    {"value": -100, "color": "red"},
                    {"value": 0, "color": "yellow"},
                    {"value": 50, "color": "green"}
                  ]
                }
              }
            }
          },
          
          {
            "id": 3,
            "title": "User Endpoints - Current Burn Rate (1h)",
            "type": "stat",
            "targets": [
              {
                "expr": "job:slo_user_burn_rate:ratio_rate1h",
                "legendFormat": "Burn Rate"
              }
            ],
            "gridPos": {"h": 8, "w": 6, "x": 12, "y": 0},
            "fieldConfig": {
              "defaults": {
                "unit": "none",
                "decimals": 2,
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    {"value": 0, "color": "green"},
                    {"value": 3, "color": "yellow"},
                    {"value": 6, "color": "orange"},
                    {"value": 14.4, "color": "red"}
                  ]
                }
              }
            }
          },
          
          {
            "id": 4,
            "title": "Health Endpoint - Current Burn Rate (1h)",
            "type": "stat",
            "targets": [
              {
                "expr": "job:slo_health_burn_rate:ratio_rate1h",
                "legendFormat": "Burn Rate"
              }
            ],
            "gridPos": {"h": 8, "w": 6, "x": 18, "y": 0},
            "fieldConfig": {
              "defaults": {
                "unit": "none",
                "decimals": 2,
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    {"value": 0, "color": "green"},
                    {"value": 3, "color": "yellow"},
                    {"value": 6, "color": "orange"},
                    {"value": 14.4, "color": "red"}
                  ]
                }
              }
            }
          },
          
          {
            "id": 5,
            "title": "User Endpoints - SLO Compliance (30d)",
            "type": "stat",
            "targets": [
              {
                "expr": "(1 - job:slo_user_errors:ratio_rate30d) * 100",
                "legendFormat": "Availability %"
              }
            ],
            "gridPos": {"h": 4, "w": 12, "x": 0, "y": 8},
            "fieldConfig": {
              "defaults": {
                "unit": "percent",
                "decimals": 3,
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    {"value": 0, "color": "red"},
                    {"value": 99, "color": "green"}
                  ]
                }
              }
            }
          },
          
          {
            "id": 6,
            "title": "Health Endpoint - SLO Compliance (30d)",
            "type": "stat",
            "targets": [
              {
                "expr": "(1 - job:slo_health_errors:ratio_rate30d) * 100",
                "legendFormat": "Availability %"
              }
            ],
            "gridPos": {"h": 4, "w": 12, "x": 12, "y": 8},
            "fieldConfig": {
              "defaults": {
                "unit": "percent",
                "decimals": 3,
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    {"value": 0, "color": "red"},
                    {"value": 99.9, "color": "green"}
                  ]
                }
              }
            }
          },
          
          {
            "id": 7,
            "title": "User Endpoints - Burn Rate Over Time",
            "type": "timeseries",
            "targets": [
              {
                "expr": "job:slo_user_burn_rate:ratio_rate1h",
                "legendFormat": "1h window"
              },
              {
                "expr": "job:slo_user_burn_rate:ratio_rate6h",
                "legendFormat": "6h window"
              }
            ],
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 12},
            "fieldConfig": {
              "defaults": {
                "custom": {
                  "lineWidth": 2
                }
              },
              "overrides": [
                {
                  "matcher": {"id": "byName", "options": "1h window"},
                  "properties": [
                    {"id": "color", "value": {"mode": "fixed", "fixedColor": "blue"}}
                  ]
                },
                {
                  "matcher": {"id": "byName", "options": "6h window"},
                  "properties": [
                    {"id": "color", "value": {"mode": "fixed", "fixedColor": "green"}}
                  ]
                }
              ]
            }
          },
          
          {
            "id": 8,
            "title": "Health Endpoint - Burn Rate Over Time",
            "type": "timeseries",
            "targets": [
              {
                "expr": "job:slo_health_burn_rate:ratio_rate1h",
                "legendFormat": "1h window"
              },
              {
                "expr": "job:slo_health_burn_rate:ratio_rate6h",
                "legendFormat": "6h window"
              }
            ],
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 12},
            "fieldConfig": {
              "defaults": {
                "custom": {
                  "lineWidth": 2
                }
              },
              "overrides": [
                {
                  "matcher": {"id": "byName", "options": "1h window"},
                  "properties": [
                    {"id": "color", "value": {"mode": "fixed", "fixedColor": "purple"}}
                  ]
                },
                {
                  "matcher": {"id": "byName", "options": "6h window"},
                  "properties": [
                    {"id": "color", "value": {"mode": "fixed", "fixedColor": "orange"}}
                  ]
                }
              ]
            }
          },
          
          {
            "id": 9,
            "title": "User Endpoints - Error Rate vs SLO Target",
            "type": "timeseries",
            "targets": [
              {
                "expr": "job:slo_user_errors:ratio_rate1h * 100",
                "legendFormat": "Actual Error Rate"
              },
              {
                "expr": "1",
                "legendFormat": "SLO Threshold (1%)"
              }
            ],
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 20},
            "fieldConfig": {
              "defaults": {
                "unit": "percent"
              }
            }
          },
          
          {
            "id": 10,
            "title": "Health Endpoint - Error Rate vs SLO Target",
            "type": "timeseries",
            "targets": [
              {
                "expr": "job:slo_health_errors:ratio_rate1h * 100",
                "legendFormat": "Actual Error Rate"
              },
              {
                "expr": "0.1",
                "legendFormat": "SLO Threshold (0.1%)"
              }
            ],
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 20},
            "fieldConfig": {
              "defaults": {
                "unit": "percent"
              }
            }
          },
          
          {
            "id": 11,
            "title": "Request Rate Comparison",
            "type": "timeseries",
            "targets": [
              {
                "expr": "sum(rate(http_request_duration_seconds_count{job=\"api\", endpoint!~\"health|metrics\"}[5m]))",
                "legendFormat": "User Requests/sec"
              },
              {
                "expr": "sum(rate(http_request_duration_seconds_count{job=\"api\", endpoint=\"health\"}[5m]))",
                "legendFormat": "Health Checks/sec"
              }
            ],
            "gridPos": {"h": 8, "w": 24, "x": 0, "y": 28},
            "fieldConfig": {
              "defaults": {
                "unit": "reqps"
              }
            }
          }
          
        ],
        "refresh": "30s",
        "schemaVersion": 36,
        "version": 1
      },
      "overwrite": true
    }