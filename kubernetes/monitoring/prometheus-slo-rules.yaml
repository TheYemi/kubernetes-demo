apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-slo-rules
  namespace: monitoring
data:
  slo-rules.yml: |
    groups:
    - name: slo_recording_rules
      interval: 30s
      rules:
      
      # good vs rotal requests (in multiple time windows)
      
      - record: job:slo_requests_total:rate5m
        expr: |
          sum(rate(http_request_duration_seconds_count{job="api"}[5m]))
      
      - record: job:slo_requests_good:rate5m
        expr: |
          sum(rate(http_request_duration_seconds_bucket{job="api", le="0.2"}[5m]))
      
      - record: job:slo_requests_total:rate1h
        expr: |
          sum(rate(http_request_duration_seconds_count{job="api"}[1h]))
      
      - record: job:slo_requests_good:rate1h
        expr: |
          sum(rate(http_request_duration_seconds_bucket{job="api", le="0.2"}[1h]))
      
      - record: job:slo_requests_total:rate6h
        expr: |
          sum(rate(http_request_duration_seconds_count{job="api"}[6h]))
      
      - record: job:slo_requests_good:rate6h
        expr: |
          sum(rate(http_request_duration_seconds_bucket{job="api", le="0.2"}[6h]))
      
      - record: job:slo_requests_total:rate1d
        expr: |
          sum(rate(http_request_duration_seconds_count{job="api"}[1d]))
      
      - record: job:slo_requests_good:rate1d
        expr: |
          sum(rate(http_request_duration_seconds_bucket{job="api", le="0.2"}[1d]))
      
      - record: job:slo_requests_total:rate3d
        expr: |
          sum(rate(http_request_duration_seconds_count{job="api"}[3d]))
      
      - record: job:slo_requests_good:rate3d
        expr: |
          sum(rate(http_request_duration_seconds_bucket{job="api", le="0.2"}[3d]))
      
      - record: job:slo_requests_total:rate30d
        expr: |
          sum(rate(http_request_duration_seconds_count{job="api"}[30d]))
      
      - record: job:slo_requests_good:rate30d
        expr: |
          sum(rate(http_request_duration_seconds_bucket{job="api", le="0.2"}[30d]))
      
      
      # error rates (for all time windows)
      
      - record: job:slo_errors:ratio_rate5m
        expr: |
          (job:slo_requests_total:rate5m - job:slo_requests_good:rate5m) 
          / 
          job:slo_requests_total:rate5m
      
      - record: job:slo_errors:ratio_rate1h
        expr: |
          (job:slo_requests_total:rate1h - job:slo_requests_good:rate1h) 
          / 
          job:slo_requests_total:rate1h
      
      - record: job:slo_errors:ratio_rate6h
        expr: |
          (job:slo_requests_total:rate6h - job:slo_requests_good:rate6h) 
          / 
          job:slo_requests_total:rate6h
      
      - record: job:slo_errors:ratio_rate1d
        expr: |
          (job:slo_requests_total:rate1d - job:slo_requests_good:rate1d) 
          / 
          job:slo_requests_total:rate1d
      
      - record: job:slo_errors:ratio_rate3d
        expr: |
          (job:slo_requests_total:rate3d - job:slo_requests_good:rate3d) 
          / 
          job:slo_requests_total:rate3d
      
      - record: job:slo_errors:ratio_rate30d
        expr: |
          (job:slo_requests_total:rate30d - job:slo_requests_good:rate30d) 
          / 
          job:slo_requests_total:rate30d
      
      
      # burn rates (for all time windows)
      
      - record: job:slo_burn_rate:ratio_rate5m
        expr: |
          job:slo_errors:ratio_rate5m / 0.01
      
      - record: job:slo_burn_rate:ratio_rate1h
        expr: |
          job:slo_errors:ratio_rate1h / 0.01
      
      - record: job:slo_burn_rate:ratio_rate6h
        expr: |
          job:slo_errors:ratio_rate6h / 0.01
      
      - record: job:slo_burn_rate:ratio_rate1d
        expr: |
          job:slo_errors:ratio_rate1d / 0.01
      
      - record: job:slo_burn_rate:ratio_rate3d
        expr: |
          job:slo_errors:ratio_rate3d / 0.01
      
      
      # error budget remaining (30-day window)
      
      - record: job:slo_error_budget:ratio
        expr: |
          1 - (job:slo_errors:ratio_rate30d / 0.01)