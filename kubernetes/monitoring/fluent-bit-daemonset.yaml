spec:
  template:
    spec:
      serviceAccountName: fluent-bit
      containers:
      - name: fluent-bit
        image: fluent/fluent-bit:3.2
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
            add:
              - CHOWN        
              - DAC_OVERRIDE 
          readOnlyRootFilesystem: false
        volumeMounts:
        - name: varlog
          mountPath: /var/log
          readOnly: true
        - name: varpodlogs
          mountPath: /var/log/pods
          readOnly: true
        - name: config
          mountPath: /fluent-bit/etc
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"