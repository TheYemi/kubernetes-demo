apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluent-bit
  namespace: monitoring
spec:
  selector:
    matchLabels:
      app: fluent-bit
  template:
    metadata:
      labels:
        app: fluent-bit
    spec:
      serviceAccountName: fluent-bit
      containers:
      - name: fluent-bit
        image: fluent/fluent-bit:3.2
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
            add:
              - CHOWN     
              - DAC_OVERRIDE
          readOnlyRootFilesystem: false
        volumeMounts:
        - name: varlog
          mountPath: /var/log/containers 
          readOnly: false    
        - name: config
          mountPath: /fluent-bit/etc
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
      volumes:
      - name: varlog
        hostPath:
          path: /var/log/containers
      - name: varpodlogs
        hostPath:
          path: /var/log/pods
      - name: config
        configMap:
          name: fluent-bit-config