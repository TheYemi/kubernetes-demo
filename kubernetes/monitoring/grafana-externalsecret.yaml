apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: grafana-external-secret
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretstore
    kind: SecretStore
  target:
    name: grafana-secret
    creationPolicy: Owner
  data:
  - secretKey: admin-password
    remoteRef:
      key: k8s-demo-grafana-admin-password