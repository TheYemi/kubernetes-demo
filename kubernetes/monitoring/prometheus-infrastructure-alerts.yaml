apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-infrastructure-alerts
  namespace: monitoring
  labels:
    app: prometheus
data:
  infrastructure-alerts.yaml: |
    groups:
    - name: infrastructure
      interval: 30s
      rules:
      # Node Alerts
      - alert: NodeHighCPU
        expr: (1 - avg(rate(node_cpu_seconds_total{mode="idle"}[5m])) by (instance)) * 100 > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Node CPU usage high"
          description: "Node {{ $labels.instance }} CPU usage is {{ $value | humanize }}%"
      
      - alert: NodeHighMemory
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Node memory usage high"
          description: "Node {{ $labels.instance }} memory usage is {{ $value | humanize }}%"
      
      - alert: NodeDiskSpaceRunningOut
        expr: (1 - (node_filesystem_avail_bytes{fstype!="tmpfs",mountpoint="/"} / node_filesystem_size_bytes{fstype!="tmpfs",mountpoint="/"})) * 100 > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Node disk space running out"
          description: "Node {{ $labels.instance }} disk usage is {{ $value | humanize }}%"
      
      # Pod Alerts
      - alert: PodCrashLooping
        expr: rate(kube_pod_container_status_restarts_total[10m]) * 60 > 0.3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Pod crash looping"
          description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is restarting frequently"
      
      - alert: DeploymentReplicasMismatch
        expr: |
          (
            kube_deployment_spec_replicas{namespace=~"prod|staging|dev"}
            !=
            kube_deployment_status_replicas_available{namespace=~"prod|staging|dev"}
          )
          and
          (
            kube_deployment_spec_replicas{namespace=~"prod|staging|dev"} > 0
          )
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Deployment replicas mismatch"
          description: "Deployment {{ $labels.namespace }}/{{ $labels.deployment }} has {{ $value }} unavailable replicas"
      
      - alert: PVCAlmostFull
        expr: (kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes) * 100 > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "PVC almost full"
          description: "PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} is {{ $value | humanize }}% full"