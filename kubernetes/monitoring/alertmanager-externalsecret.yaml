apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: alertmanager-external-secret
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretstore
    kind: SecretStore
  target:
    name: alertmanager-secret
    creationPolicy: Owner
  data:
  - secretKey: alertmanager.yml
    remoteRef:
      key: k8s-demo-alertmanager-config
