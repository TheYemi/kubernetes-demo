apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: staging

resources:
- namespace.yaml
- ../../base/common
- ../../base/api
- ../../base/frontend
- ../../base/redis
- ../../base/network-policies
- app-sealed-secret.yaml
- secretstore.yaml
- app-externalsecret.yaml

commonLabels:
  environment: staging

  # API customizations
  
  # Frontend customizations
  
  # API HPA
  
  # Frontend HPA
  
  # ConfigMap
patches:
- patch: |-
    - op: add
      path: /spec/replicas
      value: 2
    - op: add
      path: /spec/template/spec/containers/0/resources
      value:
        requests:
          memory: "96Mi"
          cpu: "75m"
        limits:
          memory: "192Mi"
          cpu: "300m"
  target:
    kind: Deployment
    name: api
- patch: |-
    - op: add
      path: /spec/replicas
      value: 2
    - op: add
      path: /spec/template/spec/containers/0/resources
      value:
        requests:
          memory: "96Mi"
          cpu: "75m"
        limits:
          memory: "192Mi"
          cpu: "300m"
  target:
    kind: Deployment
    name: frontend
- patch: |-
    - op: add
      path: /spec/minReplicas
      value: 2
    - op: add
      path: /spec/maxReplicas
      value: 4
  target:
    kind: HorizontalPodAutoscaler
    name: api-hpa
- patch: |-
    - op: add
      path: /spec/minReplicas
      value: 2
    - op: add
      path: /spec/maxReplicas
      value: 4
  target:
    kind: HorizontalPodAutoscaler
    name: frontend-hpa
- patch: |-
    - op: replace
      path: /data/APP_ENV
      value: "staging"
    - op: replace
      path: /data/LOG_LEVEL
      value: "info"
  target:
    kind: ConfigMap
    name: app-config
images:
- name: theyemiii/task-api
  newName: theyemiii/task-api
  newTag: a75cc54c4ee553cc9460d774836055d534217c40
- name: theyemiii/task-frontend
  newName: theyemiii/task-frontend
  newTag: a75cc54c4ee553cc9460d774836055d534217c40
