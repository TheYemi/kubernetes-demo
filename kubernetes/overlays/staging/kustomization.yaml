apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: staging

resources:
  - namespace.yaml
  - ../../base/common
  - ../../base/api
  - ../../base/frontend
  - ../../base/redis
  - ../../base/network-policies

commonLabels:
  environment: staging

patches:
  # API customizations
  - target:
      kind: Deployment
      name: api
    patch: |-
      - op: add
        path: /spec/replicas
        value: 2
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            memory: "96Mi"
            cpu: "75m"
          limits:
            memory: "192Mi"
            cpu: "300m"
  
  # Frontend customizations
  - target:
      kind: Deployment
      name: frontend
    patch: |-
      - op: add
        path: /spec/replicas
        value: 2
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            memory: "96Mi"
            cpu: "75m"
          limits:
            memory: "192Mi"
            cpu: "300m"
  
  # API HPA
  - target:
      kind: HorizontalPodAutoscaler
      name: api-hpa
    patch: |-
      - op: add
        path: /spec/minReplicas
        value: 2
      - op: add
        path: /spec/maxReplicas
        value: 4
  
  # Frontend HPA
  - target:
      kind: HorizontalPodAutoscaler
      name: frontend-hpa
    patch: |-
      - op: add
        path: /spec/minReplicas
        value: 2
      - op: add
        path: /spec/maxReplicas
        value: 4
  
  # ConfigMap
  - target:
      kind: ConfigMap
      name: app-config
    patch: |-
      - op: replace
        path: /data/APP_ENV
        value: "staging"
      - op: replace
        path: /data/LOG_LEVEL
        value: "info"