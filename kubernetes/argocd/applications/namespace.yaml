apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: namespaces
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/TheYemi/kubernetes-demo
    targetRevision: main
    path: kubernetes/namespaces
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
  ignoreDifferences:
  - group: ""
    kind: Namespace
    jsonPointers:
    - /metadata/labels/kubernetes.io~1metadata.name