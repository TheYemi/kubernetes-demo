apiVersion: batch/v1
kind: Job
metadata:
  name: k6-api-load-test
  namespace: prod
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: k6
        image: grafana/k6:latest
        command: ['k6', 'run', '/scripts/api-load-test.js']
        env:
        - name: API_URL
          value: "http://api.prod.svc.cluster.local:5000"
        volumeMounts:
        - name: scripts
          mountPath: /scripts
      volumes:
      - name: scripts
        configMap:
          name: k6-scripts